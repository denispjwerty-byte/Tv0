name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Unpack project
        run: unzip -q TVImprovement*.zip
      - name: Android SDK packages
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "build-tools;34.0.0" "platforms;android-34" "cmake;3.10.2.4988404" "ndk;23.2.8568313"
      - name: Build Kotlin plugin (AAR)
        working-directory: TVImprovement/android_plugin
        run: bash build_plugin.sh
      - name: Install Godot 4.3 and templates
        run: |
          V=4.3-stable
          curl -sL -o godot.zip https://github.com/godotengine/godot/releases/download/$V/Godot_v${V}_linux.x86_64.zip
          curl -sL -o tpl.tpz https://github.com/godotengine/godot/releases/download/$V/Godot_v${V}_export_templates.tpz
          unzip -q godot.zip
          sudo mv Godot_v${V}_linux.x86_64 /usr/local/bin/godot
          mkdir -p $HOME/.local/share/godot/export_templates/4.3.stable
          unzip -q tpl.tpz -d tpl
          cp -r tpl/templates/* $HOME/.local/share/godot/export_templates/4.3.stable/
      - name: Android build template and signing
        working-directory: TVImprovement
        run: |
          mkdir -p android/build
          unzip -q $HOME/.local/share/godot/export_templates/4.3.stable/android_source.zip -d android/build
          echo -n "4.3.stable" > android/.build_version
          touch android/build/.gdignore
          keytool -genkey -v -keystore $HOME/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          mkdir -p $HOME/.config/godot
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\nexport/android/debug_keystore = "%s/debug.keystore"\nexport/android/debug_keystore_user = "androiddebugkey"\nexport/android/debug_keystore_pass = "android"\n' "$ANDROID_HOME" "$JAVA_HOME" "$HOME" > $HOME/.config/godot/editor_settings-4.3.tres
      - name: Export APK
        working-directory: TVImprovement
        run: |
          godot --headless --path . --import || true
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/TVImprovement-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TVImprovement-apk
          path: TVImprovement/build/*.apk
